{% extends 'base.html' %}
{% block title %}MovieHub | Add Movie{% endblock %}

{% block content %}

<main class="container page-section">

    <div class="form-card">

        <h1>Add Movie</h1>
        <p>Enter the movie details below to add a new movie.</p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Movie Name -->
            <div class="form-group">
                <label for="movie">Movie Name</label>
                <input type="text" id="movie" name="movie" placeholder="Enter movie name" maxlength="100" required>
            </div>

            <!-- Trailer Link -->
            <div class="form-group">
                <label for="trailer_link">Trailer Link</label>
                <input type="url" id="trailer_link" name="trailer_link"
                    placeholder="https://www.youtube.com/watch?v=..." required>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" name="category" required>
                    <option value="">Select Category</option>

                    {% for category in categories %}
                    <option value="{{ category.id }}">
                        {{ category }}
                    </option>
                    {% endfor %}

                </select>
            </div>


            <!-- Movie Cast -->
            <div class="form-group">

                <label>Movie Cast</label>

                <p class="help-text">
                    Select an existing actor and enter the character name.
                </p>

                <div id="actor-container">

                    <!-- First Actor Row -->
                    <div class="actor-row">

                        <select name="actor_ids" required>

                            <option value="">Select Actor</option>

                            {% for actor in actors %}
                            <option value="{{ actor.id }}">
                                {{ actor.name }}
                            </option>
                            {% endfor %}

                        </select>

                        <input type="text" name="character_names" placeholder="Character name" required>

                        <button type="button" class="btn btn-danger remove-actor" onclick="removeActor(this)"
                            style="display:none;">
                            Remove
                        </button>

                    </div>

                </div>

                <button type="button" class="btn btn-secondary" onclick="addActorRow()">
                    + Add Another Actor
                </button>

            </div>


            <!-- Release Date -->
            <div class="form-group">
                <label for="release_date">Release Date</label>

                <input type="date" id="release_date" name="release_date" required>
            </div>


            <!-- Poster -->
            <div class="form-group">
                <label for="poster">Movie Poster</label>

                <input type="file" id="poster" name="poster" accept="image/*" required>

                <small class="help-text">
                    Upload a movie poster image.
                </small>
            </div>


            <!-- Description -->
            <div class="form-group">
                <label for="description">Description</label>

                <textarea id="description" name="description" placeholder="Enter movie description..."
                    required></textarea>
            </div>


            <!-- Rating -->
            <div class="form-group">
                <label for="rating">Rating (Out of 10)</label>

                <input type="number" id="rating" name="rating" placeholder="Example: 8.5" min="0" max="10" step="0.1"
                    required>
            </div>


            <!-- Form Buttons -->
            <div class="form-actions">

                <button type="submit" class="btn">
                    Add Movie
                </button>

                <a href="{% url 'movie_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>


<!-- Template for additional actor rows -->
<template id="actor-row-template">

    <div class="actor-row">

        <select name="actor_ids" required>

            <option value="">Select Actor</option>

            {% for actor in actors %}
            <option value="{{ actor.id }}">
                {{ actor.name }}
            </option>
            {% endfor %}

        </select>

        <input type="text" name="character_names" placeholder="Character name" required>

        <button type="button" class="btn btn-danger remove-actor" onclick="removeActor(this)">
            Remove
        </button>

    </div>

</template>


<!-- Actor Row JavaScript -->
<script>

    function addActorRow() {

        const container = document.getElementById("actor-container");

        const template = document.getElementById("actor-row-template");

        const newRow = template.content.cloneNode(true);

        container.appendChild(newRow);

        updateRemoveButtons();

    }


    function removeActor(button) {

        button.closest(".actor-row").remove();

        updateRemoveButtons();

    }


    function updateRemoveButtons() {

        const rows = document.querySelectorAll(".actor-row");

        rows.forEach(function (row) {

            const removeButton = row.querySelector(".remove-actor");

            removeButton.style.display =
                rows.length > 1 ? "inline-flex" : "none";

        });

    }

</script>


<!-- Actor Row Styling -->
<style>
    .actor-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 12px;
        align-items: start;
        margin-bottom: 14px;
    }

    .actor-row select,
    .actor-row input {
        min-width: 0;
    }

    @media (max-width: 600px) {

        .actor-row {
            grid-template-columns: 1fr;
        }

        .actor-row .btn {
            width: 100%;
        }

    }
</style>

{% endblock %}
