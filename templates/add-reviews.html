
{% extends 'base.html' %}

{% block content %}

<section class="page-section">
    <div class="container">

        <div class="form-card">

            <h1>Write Your Review</h1>

            <h2>{{ movie.movie }}</h2>

            {% if movie.poster %}
                <img src="{{ movie.poster.url }}"
                     alt="{{ movie.movie }}"
                     class="current-poster">
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="review">Your Review</label>

                    <textarea
                        id="review"
                        name="review"
                        class="form-control"
                        rows="6"
                        placeholder="Write your review here..."
                        required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">
                        Submit Review
                    </button>
                </div>

            </form>

        </div>

    </div>
</section>

{% endblock %}
