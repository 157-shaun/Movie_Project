
{% extends 'base.html' %}

{% block content %}

<div class="add-review">

    <h2>Write Your Review</h2>

    <h3>{{ movie.movie }}</h3>

    {% if movie.poster %}
        <img src="{{ movie.poster.url }}"
             alt="{{ movie.movie }}"
             width="150">
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="review">Your Review</label>

            <textarea
                id="review"
                name="review"
                rows="6"
                placeholder="Write your review here..."
                required></textarea>
        </div>

        <button type="submit">Submit Review</button>

    </form>

</div>

{% endblock %}
