
{% extends 'base.html' %}

{% block content %}

<section class="page-section">
    <div class="container">

        <div class="form-card">

            <h1>Edit Your Review</h1>

            <h2>{{ review.movie.movie }}</h2>

            {% if review.movie.poster %}
                <img src="{{ review.movie.poster.url }}"
                     alt="{{ review.movie.movie }}"
                     class="current-poster">
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="review">Your Review</label>

                    <textarea
                        id="review"
                        name="review"
                        class="form-control"
                        rows="6"
                        required>{{ review.review }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">
                        Update Review
                    </button>
                </div>

            </form>

        </div>

    </div>
</section>

{% endblock %}
