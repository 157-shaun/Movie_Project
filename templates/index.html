{% extends 'base.html' %}

{% block title %}MovieHub | Home{% endblock %}

{% block content %}
<section class="hero">
    <div class="container hero-content">
        <span class="hero-label">YOUR MOVIE COLLECTION</span>
        <h1>Discover Your Next <span>Favourite Movie</span></h1>
        <p>Explore and manage your movie collection.</p>

        <div class="hero-actions">
            <a class="btn" href="{% url 'movie_list' %}">
                Explore Movies
            </a>
            <a class="btn btn-secondary"
               href="{% url 'add_movie' %}">
                Add Movie
            </a>
        </div>
    </div>
</section>
{% endblock %}
