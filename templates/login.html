
{% extends 'base.html' %}

{% block title %}
    Login | MovieHub
{% endblock %}

{% block content %}

<main class="container page-section">

    <div class="form-card">

        <h1>Welcome Back!</h1>
        <p>Login to your MovieHub account.</p>

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <!-- Submit -->
            <div class="form-actions">

                <button type="submit" class="btn">
                    Login
                </button>

            </div>

        </form>

        <hr>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>

    </div>

</main>

{% endblock %}
