<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetFlix | Movie List</title>
</head>

<body>

    <h1>Movies</h1>

    <div>
        {% for movie in movies %}
        <div>
            <img src="{{ movie.poster.url }}" alt="{{ movie.movie }}" width="200">

            <h3>{{ movie.movie }}</h3>

            <a href="{% url 'movie_details' movie.id %}">
                <button type="button">View Details</button>
            </a>

            <form method="POST" action="{% url 'delete_movie' movie.id %}">
                {% csrf_token %}
                <button type="submit" onclick="return confirm('Are you sure you want to delete this movie?')">
                    Delete Movie
                </button>
            </form>
            <a href="{% url 'edit_movie' movie.id %}">
                <button type="button">Update</button>
            </a>
        </div>
        {% empty %}
        <p>No movies available.</p>
        {% endfor %}
    </div>

</body>

</html>
