
{% extends 'base.html' %}

{% block content %}

<section class="page-section">
    <div class="container">

        <div class="section-heading">
            <h1>Select a Movie to Review</h1>
            <p>Choose a movie and share your thoughts.</p>
        </div>

        <div class="movie-grid">

            {% for movie in movies %}

                <div class="movie-card">

                    {% if movie.poster %}
                        <img class="movie-poster"
                             src="{{ movie.poster.url }}"
                             alt="{{ movie.movie }}">
                    {% else %}
                        <div class="poster-placeholder">
                            No Poster Available
                        </div>
                    {% endif %}

                    <div class="movie-card-body">

                        <h2>{{ movie.movie }}</h2>

                        <a href="{% url 'add_review' movie.id %}"
                           class="btn">
                            Add Review
                        </a>

                    </div>

                </div>

            {% empty %}

                <div class="empty-state">
                    <p>No movies available.</p>
                </div>

            {% endfor %}

        </div>

    </div>
</section>

{% endblock %}
